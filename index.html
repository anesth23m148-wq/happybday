<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Hager</title>     
    <link type="text/css" rel="stylesheet" href="./file/default.css">
    <script type="text/javascript" src="./file/jquery.min.js"></script>
    <script type="text/javascript" src="./file/jscex.min.js"></script>
    <script type="text/javascript" src="./file/jscex-parser.js"></script>
    <script type="text/javascript" src="./file/jscex-jit.js"></script>
    <script type="text/javascript" src="./file/jscex-builderbase.min.js"></script>
    <script type="text/javascript" src="./file/jscex-async.min.js"></script>
    <script type="text/javascript" src="./file/jscex-async-powerpack.min.js"></script>
    <script type="text/javascript" src="./file/functions.js" charset="utf-8"></script>
    <script type="text/javascript" src="./file/love.js" charset="utf-8"></script>
    <script>
        function playAudio() {
            var audio = document.getElementById("myAudio");
            audio.play();
        }
    </script>
<style>
/* إصلاح التنسيق ليعمل على اللابتوب */
body {
    margin: 0;
    padding: 0;
    overflow: hidden; 
    background-color: #ffe; /* الخلفية فاتحة لتناسب الشجرة */
}

#main {
    width: 100vw;  
    height: 100vh; 
    position: relative;
}

canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
}

#wrap {
    position: relative;
    width: 100%;
    height: 100%;
}
</style>
</head>
<body onclick="playAudio()">
    <audio id="myAudio" src="aud.mp3" preload="auto" loop></audio>
    <div id="main">
        <div id="error">Browser not supported.</div>
        <div id="wrap">
            <div id="text">
                <div id="code">
                    <span class="say">You deserve all the happiness in the world</span><br>
                    <span class="say">Happy Birthday🎉 </span><br>
                    <span class="say">HAGER </span><br>
                </div>
            </div>
            <div id="clock-box">
                <span id="clock"></span>
            </div>
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
    (function() {
        var canvas = $('#canvas');
        if (!canvas[0].getContext) {
            $("#error").show();
            return false;
        }

        var width = window.innerWidth;
        var height = window.innerHeight;
        canvas.attr("width", width);
        canvas.attr("height", height);

        var opts = {
            seed: { x: width / 2 - 20, color: "rgb(190, 26, 37)", scale: 2 },
            branch: [
                [535, 680, 570, 250, 500, 200, 30, 100, [
                    [540, 500, 455, 417, 340, 400, 13, 100, [[450, 435, 434, 430, 394, 395, 2, 40]]],
                    [550, 445, 600, 356, 680, 345, 12, 100, [[578, 400, 648, 409, 661, 426, 3, 80]]],
                    [539, 281, 537, 248, 534, 217, 3, 40],
                    [546, 397, 413, 247, 328, 244, 9, 80, [
                        [427, 286, 383, 253, 371, 205, 2, 40],
                        [498, 345, 435, 315, 395, 330, 4, 60]
                    ]],
                    [546, 357, 608, 252, 678, 221, 6, 100, [[590, 293, 646, 277, 648, 271, 2, 80]]]
                ]] 
            ],
            bloom: { num: 700, width: width, height: height },
            footer: { width: width + 200, height: 5, speed: 10 }
        };

        var tree = new Tree(canvas[0], width, height, opts);
        var seed = tree.seed;
        var foot = tree.footer;
        var hold = 1;

        canvas.click(function(e) {playAudio();
            var offset = canvas.offset(), x, y;
            x = e.pageX - offset.left;
            y = e.pageY - offset.top;
            if (seed.hover(x, y)) {
                hold = 0; 
                canvas.unbind("click");
                canvas.unbind("mousemove");
                canvas.removeClass('hand');
            }
        }).mousemove(function(e) {
            var offset = canvas.offset(), x, y;
            x = e.pageX - offset.left;
            y = e.pageY - offset.top;
            canvas.toggleClass('hand', seed.hover(x, y));
        });

        var seedAnimate = eval(Jscex.compile("async", function () {
            seed.draw();
            while (hold) { $await(Jscex.Async.sleep(10)); }
            while (seed.canScale()) { seed.scale(0.95); $await(Jscex.Async.sleep(10)); }
            while (seed.canMove()) { seed.move(0, 2); foot.draw(); $await(Jscex.Async.sleep(10)); }
        }));

        var growAnimate = eval(Jscex.compile("async", function () {
            do { tree.grow(); $await(Jscex.Async.sleep(10)); } while (tree.canGrow());
        }));

        var flowAnimate = eval(Jscex.compile("async", function () {
            do { tree.flower(2); $await(Jscex.Async.sleep(10)); } while (tree.canFlower());
        }));

        var moveAnimate = eval(Jscex.compile("async", function () {
            tree.snapshot("p1", 240, 0, 610, 680);
            while (tree.move("p1", 500, 0)) { foot.draw(); $await(Jscex.Async.sleep(10)); }
            foot.draw();
            tree.snapshot("p2", 500, 0, 610, 680);
            canvas.parent().css("background", "url(" + tree.toDataURL('image/png') + ")");
            $await(Jscex.Async.sleep(300));
            canvas.css("background", "none");
        }));
        
        var textAnimate = eval(Jscex.compile("async", function () {
            $("#code").show().typewriter();
            $await(Jscex.Async.sleep(3000)); 
            
            // إضافة النصوص أسفل الشاشة
            var stats = '<div id="laptop-stats" style="position: absolute; bottom: 80px; left: 0; width: 100%; text-align: center; color: #333; z-index: 1000; font-family: sans-serif;">' +
                        '<p style="letter-spacing: 3px; font-size: 1.1rem; margin-bottom: 10px;">THE WORLD JUST GOT LUCKIER SINCE</p>' +
                        '<div style="display: flex; justify-content: center; gap: 30px; font-weight: bold; font-size: 1.3rem;">' +
                        '<span>19 Years</span> | <span>228 Months</span> | <span>6940 Days</span> | <span>166560 Hours</span>' +
                        '</div></div>';
            
            $("#wrap").append(stats);
            $("#laptop-stats").hide().fadeIn(3000);
        }));

        var runAsync = eval(Jscex.compile("async", function () {
            $await(seedAnimate());
            $await(growAnimate());
            $await(flowAnimate());
            $await(moveAnimate());
            textAnimate().start();
        }));

        runAsync().start();
    })();
    </script>
</body>
</html>
